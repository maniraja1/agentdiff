[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdiff"
version = "0.1.0"
description = "Record AI-agent runs as traces and diff them to catch regressions in CI."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agentdiff = "agentdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
